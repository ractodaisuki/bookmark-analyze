[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmark-analyze"
version = "0.1.0"
description = "Convert Firefox bookmarks.html exports into an Obsidian Dataview-ready markdown vault."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "tldextract>=5.1",
]

[project.optional-dependencies]
ai = [
  "google-genai>=1.0",
  "openai>=1.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
bookmark-analyze = "bookmark_analyze.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

